<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <style>
        body {
            background-color: #1a1a1a; /* Сделал фон страницы чуть темнее, чтобы секция выделялась */
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow: hidden;
        }

        .dark-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 48vw;
            height: 100vh;
            background: #262626; /* Цвет #262626 */
            clip-path: polygon(0 0, 70% 0, 100% 100%, 0 100%); /* Диагональный срез */
            display: flex;
            align-items: center;
            padding-left: 6%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="dark-section">
        <!-- Сюда можно закинуть твой контент -->
    </div>

</body>
</html>
