<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя линия (панель) */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #171717;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .nav-home {
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-home:hover {
            color: #ffffff;
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
            position: relative;
        }

        .btn {
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 22px;
            border-radius: 6px;
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #262626;
            color: #ffffff;
        }

        .btn-signup {
            background-color: #ff7300;
            color: #ffffff;
        }

        /* Кликабельный бокс профиля с аватаркой */
        .user-profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #262626;
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid #383838;
            user-select: none;
        }

        .user-profile-box:hover {
            background-color: #313131;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
        }

        .user-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        /* Выпадающее меню профиля */
        .profile-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            width: 180px;
            background-color: #262626;
            border-radius: 10px;
            border: 1px solid #383838;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 50;
        }

        .profile-dropdown.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .dropdown-item {
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background-color: #333333;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 360px;
            background-color: #262626;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        /* Модальные окна с таблицами/списками (шире) */
        .db-modal-content, .accounts-modal-content {
            width: 450px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 28px;
            text-transform: uppercase;
            margin: 0 auto 15px auto;
        }

        .modal-username {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .modal-userid {
            color: #ff7300;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .modal-email {
            color: #888888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .admin-db-btn {
            width: 100%;
            background-color: #383838;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .admin-db-btn:hover {
            background-color: #444444;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #888888;
            font-size: 18px;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #ffffff;
        }

        /* Список аккаунтов для смены */
        .accounts-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: left;
        }

        .accounts-list-container {
            overflow-y: auto;
            max-height: 300px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .account-item {
            background-color: #1f1f1f;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        .account-item:hover {
            background-color: #2a2a2a;
            border-color: #ff7300;
        }

        .account-item.current {
            border-color: #ff7300;
            background-color: #25201d;
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .account-mini-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
        }

        .account-details .acc-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        .account-details .acc-email {
            color: #888888;
            font-size: 12px;
        }

        .remove-saved-acc {
            background: none;
            border: none;
            color: #888888;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .remove-saved-acc:hover {
            color: #ff4d4d;
        }

        .add-account-modal-btn {
            width: 100%;
            background-color: #ff7300;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .add-account-modal-btn:hover {
            opacity: 0.9;
        }

        /* Таблица базы данных */
        .db-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: left;
        }

        .db-table-container {
            overflow-y: auto;
            max-height: 350px;
            border: 1px solid #383838;
            border-radius: 8px;
        }

        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        .db-table th {
            background-color: #1a1a1a;
            color: #888888;
            padding: 10px 12px;
            font-weight: 500;
            position: sticky;
            top: 0;
        }

        .db-table td {
            padding: 10px 12px;
            color: #ffffff;
            border-top: 1px solid #383838;
        }

        .delete-user-btn {
            background-color: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .delete-user-btn:hover {
            background-color: rgba(255, 77, 77, 0.3);
        }

        .delete-user-btn.disabled {
            background-color: #2a2a2a;
            color: #555555;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Модалка подтверждения удаления */
        .confirm-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .confirm-text {
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .confirm-actions {
            display: flex;
            gap: 10px;
        }

        .btn-confirm-delete {
            flex: 1;
            background-color: #ff4d4d;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-confirm-delete:hover {
            opacity: 0.9;
        }

        .btn-cancel-delete {
            flex: 1;
            background-color: #383838;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-cancel-delete:hover {
            background-color: #444444;
        }

        /* Центральная кнопка All Games */
        .all-games-btn {
            background-color: #262626;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
        }

        .all-games-btn:hover {
            background-color: #313131;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Верхняя линия -->
    <header class="top-bar">
        <a href="#" class="nav-home">Home</a>
        <div class="auth-buttons" id="auth-container">
            <a href="login.html" class="btn btn-login">Log in</a>
            <a href="login.html?mode=signup" class="btn btn-signup">Sign up</a>
        </div>
    </header>

    <!-- Кнопка All Games по центру -->
    <main>
        <button class="all-games-btn">All Games</button>
    </main>

    <!-- Модальное окно профиля -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn">&times;</button>
            <div class="modal-avatar" id="modal-avatar-box">U</div>
            <div class="modal-username" id="modal-username-text">Username</div>
            <div class="modal-userid" id="modal-userid-text">ID: 1</div>
            <div class="modal-email" id="modal-email-text">email@example.com</div>

            <div class="profile-actions">
                <button class="admin-db-btn" id="open-db-btn">View Database</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно смены аккаунта (список всех входов) -->
    <div class="modal-overlay" id="switch-modal">
        <div class="modal-content accounts-modal-content">
            <button class="close-modal" id="close-switch-modal-btn">&times;</button>
            <div class="accounts-title">Switch Account</div>
            <div class="accounts-list-container" id="accounts-list">
                <!-- Заполняется динамически -->
            </div>
            <button class="add-account-modal-btn" id="add-account-btn">+ Add Account</button>
        </div>
    </div>

    <!-- Модальное окно базы данных (для knqw) -->
    <div class="modal-overlay" id="db-modal">
        <div class="modal-content db-modal-content">
            <button class="close-modal" id="close-db-modal-btn">&times;</button>
            <div class="db-title">Database Accounts</div>
            <div class="db-table-container">
                <table class="db-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Password</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="db-tbody">
                        <!-- Заполняется динамически -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно подтверждения удаления -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <div class="confirm-title">Delete Account</div>
            <div class="confirm-text" id="confirm-text">Are you sure you want to delete this account?</div>
            <div class="confirm-actions">
                <button class="btn-confirm-delete" id="confirm-yes-btn">Delete</button>
                <button class="btn-cancel-delete" id="confirm-no-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function getColorFromName(name) {
            const colors = ['#ff7300', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#009688', '#4caf50', '#ff9800'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        const currentUser = localStorage.getItem('currentUser');
        const authContainer = document.getElementById('auth-container');
        
        // Модалки
        const profileModal = document.getElementById('profile-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalAvatarBox = document.getElementById('modal-avatar-box');
        const modalUsernameText = document.getElementById('modal-username-text');
        const modalUserIdText = document.getElementById('modal-userid-text');
        const modalEmailText = document.getElementById('modal-email-text');
        const openDbBtn = document.getElementById('open-db-btn');

        const switchModal = document.getElementById('switch-modal');
        const closeSwitchModalBtn = document.getElementById('close-switch-modal-btn');
        const accountsList = document.getElementById('accounts-list');
        const addAccountBtn = document.getElementById('add-account-btn');

        const dbModal = document.getElementById('db-modal');
        const closeDbModalBtn = document.getElementById('close-db-modal-btn');
        const dbTbody = document.getElementById('db-tbody');

        const confirmModal = document.getElementById('confirm-modal');
        const confirmText = document.getElementById('confirm-text');
        const confirmYesBtn = document.getElementById('confirm-yes-btn');
        const confirmNoBtn = document.getElementById('confirm-no-btn');

        let userToDelete = null;

        // Автоматически добавляем текущего пользователя в историю входов (savedAccounts)
        if (currentUser) {
            let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts')) || [];
            if (!savedAccounts.includes(currentUser)) {
                savedAccounts.push(currentUser);
                localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
            }
        }

        function renderDatabaseTable() {
            const allUsers = JSON.parse(localStorage.getItem('users')) || [];
            dbTbody.innerHTML = '';
            
            allUsers.forEach(u => {
                const isProtected = u.customId === 'knqw';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${u.customId || '-'}</td>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>${u.password}</td>
                    <td>
                        <button class="delete-user-btn ${isProtected ? 'disabled' : ''}" 
                                data-username="${u.username}" 
                                ${isProtected ? 'disabled title="Protected account"' : ''}>
                            ${isProtected ? 'Protected' : 'Delete'}
                        </button>
                    </td>
                `;
                dbTbody.appendChild(row);
            });

            document.querySelectorAll('.delete-user-btn:not(.disabled)').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    userToDelete = e.target.getAttribute('data-username');
                    confirmText.textContent = `Are you sure you want to delete user "${userToDelete}"?`;
                    dbModal.classList.remove('active');
                    confirmModal.classList.add('active');
                });
            });
        }

        // Рендер списка аккаунтов для смены
        function renderSwitchAccountsList() {
            let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts')) || [];
            let allUsers = JSON.parse(localStorage.getItem('users')) || [];
            accountsList.innerHTML = '';

            if (savedAccounts.length === 0) {
                accountsList.innerHTML = '<div style="color: #888; font-size: 13px; text-align: center; padding: 20px;">No other accounts saved.</div>';
                return;
            }

            savedAccounts.forEach(accName => {
                const userData = allUsers.find(u => u.username === accName) || { email: 'Unknown email' };
                const isCurrent = accName === currentUser;
                const firstLetter = accName.charAt(0).toUpperCase();
                const avatarColor = getColorFromName(accName);

                const item = document.createElement('div');
                item.className = `account-item ${isCurrent ? 'current' : ''}`;
                item.innerHTML = `
                    <div class="account-info" style="flex: 1; cursor: pointer;">
                        <div class="account-mini-avatar" style="background-color: ${avatarColor};">${firstLetter}</div>
                        <div class="account-details">
                            <div class="acc-name">${accName} ${isCurrent ? '<span style="color: #ff7300; font-size: 11px; margin-left: 5px;">(Current)</span>' : ''}</div>
                            <div class="acc-email">${userData.email}</div>
                        </div>
                    </div>
                    <button class="remove-saved-acc" data-username="${accName}" title="Remove from list">&times;</button>
                `;

                // Клик по информации аккаунта -> переключение на него
                item.querySelector('.account-info').addEventListener('click', () => {
                    localStorage.setItem('currentUser', accName);
                    window.location.reload();
                });

                // Клик по крестику -> удаление из истории входов
                item.querySelector('.remove-saved-acc').addEventListener('click', (e) => {
                    e.stopPropagation();
                    let updatedSaved = savedAccounts.filter(name => name !== accName);
                    localStorage.setItem('savedAccounts', JSON.stringify(updatedSaved));

                    // Если удалили текущего из списка истории, но он остался в базе
                    if (accName === currentUser) {
                        localStorage.removeItem('currentUser');
                        window.location.reload();
                        return;
                    }

                    renderSwitchAccountsList();
                });

                accountsList.appendChild(item);
            });
        }

        if (currentUser) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            let userData = users.find(u => u.username === currentUser);

            if (!userData) {
                userData = { username: currentUser, email: 'No email', customId: '1' };
            }

            const displayId = userData.customId || '1';
            const firstLetter = currentUser.charAt(0).toUpperCase();
            const avatarColor = getColorFromName(currentUser);

            authContainer.innerHTML = `
                <div class="user-profile-box" id="profile-toggle-btn">
                    <div class="user-avatar" style="background-color: ${avatarColor};">${firstLetter}</div>
                    <span class="user-name">${currentUser}</span>
                </div>
                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="dropdown-item" id="menu-profile-btn">Profile</button>
                    <button class="dropdown-item" id="menu-switch-btn">Switch Account</button>
                </div>
            `;

            const profileToggleBtn = document.getElementById('profile-toggle-btn');
            const profileDropdown = document.getElementById('profile-dropdown');
            const menuProfileBtn = document.getElementById('menu-profile-btn');
            const menuSwitchBtn = document.getElementById('menu-switch-btn');

            modalAvatarBox.style.backgroundColor = avatarColor;
            modalAvatarBox.textContent = firstLetter;
            modalUsernameText.textContent = userData.username;
            modalUserIdText.textContent = `ID: ${displayId}`;
            modalEmailText.textContent = userData.email;

            if (displayId === 'knqw') {
                openDbBtn.style.display = 'block';
            }

            // Открытие / закрытие выпадающего меню
            profileToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('active');
            });

            document.addEventListener('click', (e) => {
                if (!authContainer.contains(e.target)) {
                    profileDropdown.classList.remove('active');
                }
            });

            // Кнопка "Profile"
            menuProfileBtn.addEventListener('click', () => {
                profileDropdown.classList.remove('active');
                profileModal.classList.add('active');
            });

            // Кнопка "Switch Account" -> открывает модалку со списком аккаунтов
            menuSwitchBtn.addEventListener('click', () => {
                profileDropdown.classList.remove('active');
                renderSwitchAccountsList();
                switchModal.classList.add('active');
            });

            closeModalBtn.addEventListener('click', () => {
                profileModal.classList.remove('active');
            });

            profileModal.addEventListener('click', (e) => {
                if (e.target === profileModal) {
                    profileModal.classList.remove('active');
                }
            });

            // Закрытие модалки Switch Account
            closeSwitchModalBtn.addEventListener('click', () => {
                switchModal.classList.remove('active');
            });

            switchModal.addEventListener('click', (e) => {
                if (e.target === switchModal) {
                    switchModal.classList.remove('active');
                }
            });

            // Кнопка "+ Add Account" внутри модалки смены аккаунта
            addAccountBtn.addEventListener('click', () => {
                window.location.href = 'login.html';
            });

            // База данных
            openDbBtn.addEventListener('click', () => {
                renderDatabaseTable();
                profileModal.classList.remove('active');
                dbModal.classList.add('active');
            });

            closeDbModalBtn.addEventListener('click', () => {
                dbModal.classList.remove('active');
            });

            dbModal.addEventListener('click', (e) => {
                if (e.target === dbModal) {
                    dbModal.classList.remove('active');
                }
            });

            // Подтверждение удаления
            confirmNoBtn.addEventListener('click', () => {
                confirmModal.classList.remove('active');
                dbModal.classList.add('active');
            });

            confirmYesBtn.addEventListener('click', () => {
                if (userToDelete) {
                    let allUsers = JSON.parse(localStorage.getItem('users')) || [];
                    const targetUser = allUsers.find(u => u.username === userToDelete);
                    if (targetUser && targetUser.customId === 'knqw') {
                        alert('Protected account cannot be deleted!');
                        confirmModal.classList.remove('active');
                        dbModal.classList.add('active');
                        return;
                    }

                    allUsers = allUsers.filter(u => u.username !== userToDelete);
                    localStorage.setItem('users', JSON.stringify(allUsers));

                    // Также удаляем из истории сохраненных аккаунтов
                    let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts')) || [];
                    savedAccounts = savedAccounts.filter(name => name !== userToDelete);
                    localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));

                    if (userToDelete === currentUser) {
                        localStorage.removeItem('currentUser');
                        window.location.reload();
                        return;
                    }

                    renderDatabaseTable();
                }
                confirmModal.classList.remove('active');
                dbModal.classList.add('active');
            });
        }
    </script>

</body>
</html>
