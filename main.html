<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя линия (панель) */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #171717;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .nav-home {
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-home:hover {
            color: #ffffff;
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 22px;
            border-radius: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #262626;
            color: #ffffff;
        }

        .btn-signup {
            background-color: #ff7300;
            color: #ffffff;
        }

        /* Контент по центру экрана */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            text-align: center;
        }

        .center-content h1 {
            color: #ffffff;
            font-size: 28px;
            margin: 0;
            font-weight: 600;
        }

        .game-cards {
            display: flex;
            gap: 25px;
        }

        /* Карточка игры */
        .game-card {
            background-color: #262626;
            color: #ffffff;
            text-decoration: none;
            padding: 20px;
            border-radius: 12px;
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .game-card:hover {
            background-color: #313131;
            transform: translateY(-4px);
        }

        /* Иконка игры */
        .game-card img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Название игры */
        .game-card span {
            font-weight: 500;
            font-size: 14px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <!-- Верхняя линия -->
    <header class="top-bar">
        <a href="#" class="nav-home">Home</a>
        <div class="auth-buttons">
            <button class="btn btn-login">Log in</button>
            <button class="btn btn-signup">Sign up</button>
        </div>
    </header>

    <!-- Разделы по центру экрана с иконками -->
    <main class="center-content">
        <h1>Select a Game</h1>
        <div class="game-cards">
            <!-- Murder Mystery 2 -->
            <a href="https://murdermystery.fandom.com/wiki/Murder_Mystery_2" target="_blank" class="game-card">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80" alt="Murder Mystery 2">
                <span>Murder Mystery 2</span>
            </a>
            
            <!-- Blade Ball -->
            <a href="#" class="game-card">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=150&auto=format&fit=crop&q=80" alt="Blade Ball">
                <span>Blade Ball</span>
            </a>
            
            <!-- Adopt Me -->
            <a href="#" class="game-card">
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=150&auto=format&fit=crop&q=80" alt="Adopt Me">
                <span>Adopt Me</span>
            </a>
        </div>
    </main>

</body>
</html>
