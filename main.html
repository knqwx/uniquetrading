<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя линия (панель) */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #171717;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .nav-home {
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-home:hover {
            color: #ffffff;
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 22px;
            border-radius: 6px;
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #262626;
            color: #ffffff;
        }

        .btn-signup {
            background-color: #ff7300;
            color: #ffffff;
        }

        /* Кликабельный бокс профиля с аватаркой */
        .user-profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #262626;
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid #383838;
        }

        .user-profile-box:hover {
            background-color: #313131;
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
        }

        .user-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        /* Модальное окно профиля */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 360px;
            background-color: #262626;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 28px;
            text-transform: uppercase;
            margin: 0 auto 15px auto;
        }

        .modal-username {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .modal-id-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 5px;
        }

        .modal-userid {
            color: #ff7300;
            font-size: 13px;
            font-weight: 500;
        }

        .edit-id-btn {
            background: none;
            border: none;
            color: #888888;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

        .edit-id-btn:hover {
            color: #ffffff;
        }

        .modal-email {
            color: #888888;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Поле ввода для смены ID (скрыто по умолчанию) */
        .edit-id-section {
            margin-bottom: 20px;
            display: none;
            text-align: left;
        }

        .edit-id-section.active {
            display: block;
        }

        .edit-id-section input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 6px;
            padding: 8px 12px;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 8px;
        }

        .edit-id-section input:focus {
            border-color: #ff7300;
        }

        .edit-id-actions {
            display: flex;
            gap: 8px;
        }

        .save-id-btn, .cancel-id-btn {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-id-btn {
            background-color: #ff7300;
            color: #ffffff;
        }

        .cancel-id-btn {
            background-color: #383838;
            color: #ffffff;
        }

        .modal-error {
            color: #ff4d4d;
            font-size: 11px;
            margin-bottom: 10px;
            display: none;
        }

        .logout-modal-btn {
            width: 100%;
            background-color: #383838;
            color: #ff4d4d;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .logout-modal-btn:hover {
            background-color: #444444;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #888888;
            font-size: 18px;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #ffffff;
        }

        /* Центральная кнопка All Games */
        .all-games-btn {
            background-color: #262626;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
        }

        .all-games-btn:hover {
            background-color: #313131;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Верхняя линия -->
    <header class="top-bar">
        <a href="#" class="nav-home">Home</a>
        <div class="auth-buttons" id="auth-container">
            <a href="login.html" class="btn btn-login">Log in</a>
            <a href="login.html?mode=signup" class="btn btn-signup">Sign up</a>
        </div>
    </header>

    <!-- Кнопка All Games по центру -->
    <main>
        <button class="all-games-btn">All Games</button>
    </main>

    <!-- Модальное окно профиля -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn">&times;</button>
            <div class="modal-avatar" id="modal-avatar-box">U</div>
            <div class="modal-username" id="modal-username-text">Username</div>
            
            <div class="modal-id-container">
                <span class="modal-userid" id="modal-userid-text">ID: #1</span>
                <button class="edit-id-btn" id="open-edit-id-btn">Edit ID</button>
            </div>

            <div class="modal-email" id="modal-email-text">email@example.com</div>

            <!-- Блок изменения ID -->
            <div class="edit-id-section" id="edit-id-section">
                <div class="modal-error" id="id-error-msg"></div>
                <input type="text" id="new-id-input" placeholder="Enter new ID">
                <div class="edit-id-actions">
                    <button class="save-id-btn" id="save-id-btn">Save</button>
                    <button class="cancel-id-btn" id="cancel-id-btn">Cancel</button>
                </div>
            </div>

            <button class="logout-modal-btn" id="logout-btn">Log out</button>
        </div>
    </div>

    <script>
        function getColorFromName(name) {
            const colors = ['#ff7300', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#009688', '#4caf50', '#ff9800'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        const currentUser = localStorage.getItem('currentUser');
        const authContainer = document.getElementById('auth-container');
        const profileModal = document.getElementById('profile-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalAvatarBox = document.getElementById('modal-avatar-box');
        const modalUsernameText = document.getElementById('modal-username-text');
        const modalUserIdText = document.getElementById('modal-userid-text');
        const modalEmailText = document.getElementById('modal-email-text');
        const logoutBtn = document.getElementById('logout-btn');

        const openEditIdBtn = document.getElementById('open-edit-id-btn');
        const editIdSection = document.getElementById('edit-id-section');
        const newIdInput = document.getElementById('new-id-input');
        const saveIdBtn = document.getElementById('save-id-btn');
        const cancelIdBtn = document.getElementById('cancel-id-btn');
        const idErrorMsg = document.getElementById('id-error-msg');

        if (currentUser) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            let userData = users.find(u => u.username === currentUser);

            if (!userData) {
                userData = { username: currentUser, email: 'No email', customId: '1' };
            }

            const displayId = userData.customId || '1';
            const firstLetter = currentUser.charAt(0).toUpperCase();
            const avatarColor = getColorFromName(currentUser);

            authContainer.innerHTML = `
                <div class="user-profile-box" id="open-profile-btn">
                    <div class="user-avatar" style="background-color: ${avatarColor};">${firstLetter}</div>
                    <span class="user-name">${currentUser}</span>
                </div>
            `;

            modalAvatarBox.style.backgroundColor = avatarColor;
            modalAvatarBox.textContent = firstLetter;
            modalUsernameText.textContent = userData.username;
            modalUserIdText.textContent = `ID: #${displayId}`;
            modalEmailText.textContent = userData.email;

            // Открытие модального окна
            document.getElementById('open-profile-btn').addEventListener('click', () => {
                profileModal.classList.add('active');
            });

            closeModalBtn.addEventListener('click', () => {
                profileModal.classList.remove('active');
                editIdSection.classList.remove('active');
                idErrorMsg.style.display = 'none';
            });

            profileModal.addEventListener('click', (e) => {
                if (e.target === profileModal) {
                    profileModal.classList.remove('active');
                    editIdSection.classList.remove('active');
                    idErrorMsg.style.display = 'none';
                }
            });

            // Логика открытия поля смены ID
            openEditIdBtn.addEventListener('click', () => {
                newIdInput.value = displayId;
                editIdSection.classList.add('active');
                idErrorMsg.style.display = 'none';
            });

            cancelIdBtn.addEventListener('click', () => {
                editIdSection.classList.remove('active');
                idErrorMsg.style.display = 'none';
            });

            // Сохранение нового ID
            saveIdBtn.addEventListener('click', () => {
                const newId = newIdInput.value.trim();
                idErrorMsg.style.display = 'none';

                if (!newId) {
                    idErrorMsg.textContent = 'ID cannot be empty.';
                    idErrorMsg.style.display = 'block';
                    return;
                }

                // Проверяем, не занят ли этот ID другим пользователем
                const idExists = users.some(u => u.customId === newId && u.username !== currentUser);
                if (idExists) {
                    idErrorMsg.textContent = 'This ID is already taken.';
                    idErrorMsg.style.display = 'block';
                    return;
                }

                // Обновляем ID в массиве пользователей
                userData.customId = newId;
                localStorage.setItem('users', JSON.stringify(users));

                // Обновляем отображение
                modalUserIdText.textContent = `ID: #${newId}`;
                editIdSection.classList.remove('active');
            });

            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('currentUser');
                window.location.reload();
            });
        }
    </script>

</body>
</html>
