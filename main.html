<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Верхняя линия (панель) */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #171717;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .nav-home {
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-home:hover {
            color: #ffffff;
        }

        .auth-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 22px;
            border-radius: 6px;
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #262626;
            color: #ffffff;
        }

        .btn-signup {
            background-color: #ff7300;
            color: #ffffff;
        }

        /* Центральная кнопка All Games */
        .all-games-btn {
            background-color: #262626;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
        }

        .all-games-btn:hover {
            background-color: #313131;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Верхняя линия -->
    <header class="top-bar">
        <a href="#" class="nav-home">Home</a>
        <div class="auth-buttons">
            <a href="login.html" class="btn btn-login">Log in</a>
            <a href="login.html?mode=signup" class="btn btn-signup">Sign up</a>
        </div>
    </header>

    <!-- Кнопка All Games по центру -->
    <main>
        <button class="all-games-btn">All Games</button>
    </main>

</body>
</html>
