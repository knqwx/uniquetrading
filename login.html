<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Общий контейнер */
        .auth-container {
            width: 380px;
            background-color: #262626;
            border-radius: 12px;
            padding: 40px 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        h2 {
            color: #ffffff;
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        /* Ошибки */
        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        /* Анимация сдвигания и раздвигания полей */
        .input-group {
            position: relative;
            margin-bottom: 16px;
            max-height: 85px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        margin-bottom 0.35s ease;
        }

        .input-group.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .input-group label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #ff7300;
        }

        /* Кнопка отправки */
        .submit-btn {
            width: 100%;
            background-color: #ff7300;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Текст внизу для переключения */
        .auth-footer {
            text-align: center;
            color: #888888;
            font-size: 13px;
            margin-top: 20px;
        }

        .auth-footer button {
            background: none;
            border: none;
            color: #ff7300;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .auth-footer button:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="container">
        <h2 id="form-title">Log in</h2>
        
        <div class="error-message" id="error-msg"></div>

        <form id="auth-form">
            <!-- Поле Username -->
            <div class="input-group collapsed" id="username-group">
                <label>Username</label>
                <input type="text" id="username-input" placeholder="Choose a username">
            </div>

            <div class="input-group">
                <label id="main-label">Username or email</label>
                <input type="text" id="main-input" placeholder="Enter your username or email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password-input" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Log in</button>

            <div class="auth-footer" id="auth-footer-text">
                <span id="footer-text">Don't have an account?</span> <button type="button" id="toggle-btn">Sign up</button>
            </div>
        </form>
    </div>

    <script>
        const formTitle = document.getElementById('form-title');
        const usernameGroup = document.getElementById('username-group');
        const usernameInput = document.getElementById('username-input');
        const mainLabel = document.getElementById('main-label');
        const mainInput = document.getElementById('main-input');
        const passwordInput = document.getElementById('password-input');
        const submitBtn = document.getElementById('submit-btn');
        const footerText = document.getElementById('footer-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');

        let isLoginMode = true;

        function setMode(loginMode) {
            isLoginMode = loginMode;
            errorMsg.style.display = 'none';

            if (!isLoginMode) {
                formTitle.textContent = 'Sign up';
                usernameGroup.classList.remove('collapsed');
                usernameInput.setAttribute('required', 'true');
                mainLabel.textContent = 'Email';
                mainInput.placeholder = 'Enter your email';
                submitBtn.textContent = 'Sign up';
                footerText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Log in';
            } else {
                formTitle.textContent = 'Log in';
                usernameGroup.classList.add('collapsed');
                usernameInput.removeAttribute('required');
                mainLabel.textContent = 'Username or email';
                mainInput.placeholder = 'Enter your username or email';
                submitBtn.textContent = 'Log in';
                footerText.textContent = "Don't have an account?";
                toggleBtn.textContent = 'Sign up';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'signup') {
            setMode(false);
        }

        toggleBtn.addEventListener('click', () => {
            setMode(!isLoginMode);
        });

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            let users = JSON.parse(localStorage.getItem('users')) || [];

            if (!isLoginMode) {
                const username = usernameInput.value.trim();
                const email = mainInput.value.trim();
                const password = passwordInput.value;

                const existingUser = users.find(u => u.username === username);
                if (existingUser) {
                    errorMsg.textContent = 'This username is already taken.';
                    errorMsg.style.display = 'block';
                    return;
                }

                users.push({ username, email, password });
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', username);

                window.location.href = 'main.html';

            } else {
                const loginIdentifier = mainInput.value.trim();
                const password = passwordInput.value;

                const foundUser = users.find(u => (u.username === loginIdentifier || u.email === loginIdentifier) && u.password === password);

                if (foundUser) {
                    localStorage.setItem('currentUser', foundUser.username);
                    window.location.href = 'main.html';
                } else {
                    errorMsg.textContent = 'Invalid username/email or password.';
                    errorMsg.style.display = 'block';
                }
            }
        });
    </script>

</body>
</html>
