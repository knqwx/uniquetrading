<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading - Auth</title>
    <!-- Иконка сайта -->
    <link rel="icon" href="unique.png" type="image/png">
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-container {
            width: 380px;
            background-color: #262626;
            border-radius: 12px;
            padding: 30px 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        h2 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            max-height: 85px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        margin-bottom 0.35s ease;
        }

        .input-group.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .input-group label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #ff7300;
        }

        /* Стили для блока капчи */
        .captcha-group {
            margin-bottom: 16px;
        }

        .captcha-group label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-question {
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ff7300;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            user-select: none;
        }

        .captcha-box input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .captcha-box input:focus {
            border-color: #ff7300;
        }

        .submit-btn {
            width: 100%;
            background-color: #ff7300;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .auth-footer {
            text-align: center;
            color: #888888;
            font-size: 13px;
            margin-top: 20px;
        }

        .auth-footer button {
            background: none;
            border: none;
            color: #ff7300;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .auth-footer button:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="container">
        <div class="brand-header">
            <img src="unique.png" alt="Unique Logo" class="brand-icon">
            <h2 id="form-title">Log in</h2>
        </div>
        
        <div class="error-message" id="error-msg"></div>

        <form id="auth-form">
            <div class="input-group collapsed" id="username-group">
                <label>Username</label>
                <input type="text" id="username-input" placeholder="Choose a username">
            </div>

            <div class="input-group">
                <label id="main-label">Username or email</label>
                <input type="text" id="main-input" placeholder="Enter your username or email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password-input" placeholder="Enter your password">
            </div>

            <!-- Математическая капча -->
            <div class="captcha-group">
                <label>Security verification</label>
                <div class="captcha-box">
                    <div class="captcha-question" id="captcha-question">? + ? =</div>
                    <input type="text" id="captcha-input" placeholder="Answer">
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Log in</button>

            <div class="auth-footer" id="auth-footer-text">
                <span id="footer-text">Don't have an account?</span> <button type="button" id="toggle-btn">Sign up</button>
            </div>
        </form>
    </div>

    <!-- Подключаем Turso Client через стабильный ESM-модуль -->
    <script type="module">
        import { createClient } from "https://esm.sh/@libsql/client@0.6.0/web";

        const db = createClient({
            url: "libsql://unique-knqw.aws-eu-west-1.turso.io",
            authToken: "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3OTA2MDU2NDIsImlkIjoiMDFhMGU1NjctNjYwMS03NmMyLWE2YzUtODQyNTEzYTk4MjgzIiwia2lkIjoiakdIakdfX1A3bTFmRGxXRHNhbFR1dGg0OHB6VTF5MFVMZGQ1TzhIUm94ZyIsInJpZCI6ImNjODc2N2NkLTMwYmYtNDJiNy04NDQ1LTIxNjRjY2E0OTNlMSJ9.0hZK9eeqN3Md2Dh7ZgWKDOJlk-3GHN8OZxGvKb_aGVjCQllclb1A3Z0EAstpv18ejSRHHGOB0yoOkm1se5A0Bg"
        });

        async function initDB() {
            try {
                // Создаем таблицы с числовыми ID и правильными внешними ключами
                await db.execute(`
                    CREATE TABLE IF NOT EXISTS users (
                        id INTEGER PRIMARY KEY AUTOINCREMENT,
                        username TEXT UNIQUE NOT NULL,
                        display_name TEXT NOT NULL,
                        email TEXT UNIQUE NOT NULL,
                        password TEXT NOT NULL,
                        avatar TEXT,
                        balance REAL DEFAULT 0,
                        created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                    )
                `);

                await db.execute(`
                    CREATE TABLE IF NOT EXISTS listings (
                        id TEXT PRIMARY KEY,
                        user_id INTEGER NOT NULL,
                        title TEXT NOT NULL,
                        category TEXT NOT NULL,
                        type TEXT NOT NULL,
                        price REAL,
                        description TEXT,
                        image TEXT,
                        created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
                    )
                `);

                await db.execute(`
                    CREATE TABLE IF NOT EXISTS messages (
                        id TEXT PRIMARY KEY,
                        sender_id INTEGER NOT NULL,
                        receiver_id INTEGER NOT NULL,
                        listing_id TEXT,
                        content TEXT NOT NULL,
                        is_read INTEGER DEFAULT 0,
                        created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
                        FOREIGN KEY (sender_id) REFERENCES users(id) ON DELETE CASCADE,
                        FOREIGN KEY (receiver_id) REFERENCES users(id) ON DELETE CASCADE,
                        FOREIGN KEY (listing_id) REFERENCES listings(id) ON DELETE SET NULL
                    )
                `);
            } catch (e) {
                console.error("DB init error:", e);
            }
        }
        initDB();

        const formTitle = document.getElementById('form-title');
        const usernameGroup = document.getElementById('username-group');
        const usernameInput = document.getElementById('username-input');
        const mainLabel = document.getElementById('main-label');
        const mainInput = document.getElementById('main-input');
        const passwordInput = document.getElementById('password-input');
        const captchaQuestion = document.getElementById('captcha-question');
        const captchaInput = document.getElementById('captcha-input');
        const submitBtn = document.getElementById('submit-btn');
        const footerText = document.getElementById('footer-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const authForm = document.getElementById('auth-form');
        const errorMsg = document.getElementById('error-msg');

        let isLoginMode = true;
        let correctAnswer = 0;

        // Генерация новой капчи
        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 + num2;
            captchaQuestion.textContent = `${num1} + ${num2} =`;
            captchaInput.value = '';
        }

        generateCaptcha();

        function setMode(loginMode) {
            isLoginMode = loginMode;
            errorMsg.style.display = 'none';
            generateCaptcha();

            if (!isLoginMode) {
                formTitle.textContent = 'Sign up';
                usernameGroup.classList.remove('collapsed');
                mainLabel.textContent = 'Email';
                mainInput.placeholder = 'Enter your email';
                submitBtn.textContent = 'Sign up';
                footerText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Log in';
            } else {
                formTitle.textContent = 'Log in';
                usernameGroup.classList.add('collapsed');
                mainLabel.textContent = 'Username or email';
                mainInput.placeholder = 'Enter your username or email';
                submitBtn.textContent = 'Log in';
                footerText.textContent = "Don't have an account?";
                toggleBtn.textContent = 'Sign up';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'signup') {
            setMode(false);
        }

        toggleBtn.addEventListener('click', () => {
            setMode(!isLoginMode);
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            generateCaptcha();
        }

        // ===== IP ban check =====
        let visitorIp = null;
        async function getVisitorIp() {
            if (visitorIp !== null) return visitorIp;
            const cached = sessionStorage.getItem('myIp');
            if (cached) { visitorIp = cached; return visitorIp; }
            for (const url of ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json']) {
                try {
                    const ctl = new AbortController();
                    const t = setTimeout(() => ctl.abort(), 4000);
                    const r = await fetch(url, { signal: ctl.signal });
                    clearTimeout(t);
                    const j = await r.json();
                    if (j && j.ip) { visitorIp = String(j.ip); sessionStorage.setItem('myIp', visitorIp); return visitorIp; }
                } catch (e) { /* try the next one */ }
            }
            visitorIp = '';
            return visitorIp;
        }
        async function getActiveIpBan() {
            const ip = await getVisitorIp();
            if (!ip) return null;
            try {
                const rs = await db.execute({ sql: "SELECT * FROM ip_bans WHERE ip = ?", args: [ip] });
                if (!rs.rows.length) return null;
                const r = rs.rows[0];
                const until = Number(r.bannedUntil);
                if (until !== -1 && until <= Date.now()) {
                    await db.execute({ sql: "DELETE FROM ip_bans WHERE ip = ?", args: [ip] });
                    return null;
                }
                return { until, reason: r.reason || '' };
            } catch (e) { return null; }
        }
        function ipBanText(ban) {
            let when = 'permanently';
            if (ban.until !== -1) {
                const ms = Math.max(0, ban.until - Date.now());
                const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
                when = 'for another ' + (d > 0 ? `${d}d ${h}h` : (h > 0 ? `${h}h ${m}m` : `${Math.max(1, m)}m`));
            }
            return `Your IP address is banned ${when}.` + (ban.reason ? ` Reason: ${ban.reason}` : '');
        }
        (async () => {
            const ban = await getActiveIpBan();
            if (ban) showError(ipBanText(ban));
        })();

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const userCaptchaAnswer = parseInt(captchaInput.value.trim(), 10);
            if (isNaN(userCaptchaAnswer) || userCaptchaAnswer !== correctAnswer) {
                showError('Incorrect security answer. Please try again.');
                return;
            }

            if (!isLoginMode) {
                const username = usernameInput.value.trim();
                const email = mainInput.value.trim();
                const password = passwordInput.value;

                if (!username || !email || !password) {
                    showError('Please fill in all fields.');
                    return;
                }

                if (username.length < 3) {
                    showError('Username must be at least 3 characters long.');
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    showError('Please enter a valid email address.');
                    return;
                }

                if (password.length < 6) {
                    showError('Password must be at least 6 characters long.');
                    return;
                }

                const signupBan = await getActiveIpBan();
                if (signupBan) {
                    showError(ipBanText(signupBan));
                    return;
                }

                try {
                    const checkUser = await db.execute({
                        sql: "SELECT * FROM users WHERE username = ?",
                        args: [username]
                    });
                    if (checkUser.rows.length > 0) {
                        showError('This username is already taken.');
                        return;
                    }

                    const checkEmail = await db.execute({
                        sql: "SELECT * FROM users WHERE email = ?",
                        args: [email]
                    });
                    if (checkEmail.rows.length > 0) {
                        showError('This email is already registered.');
                        return;
                    }

                    // Числовой ID выдается базой автоматически (AUTOINCREMENT), передаем только данные
                    await db.execute({
                        sql: `INSERT INTO users (username, display_name, email, password, balance) VALUES (?, ?, ?, ?, ?)`,
                        args: [username, username, email, password, 0]
                    });

                    const ipNew = await getVisitorIp();
                    if (ipNew) {
                        try { await db.execute({ sql: "UPDATE users SET lastIp = ? WHERE username = ?", args: [ipNew, username] }); } catch (e) {}
                    }

                    localStorage.setItem('currentUser', username);
                    window.location.href = 'uniquetrading.html';
                } catch (err) {
                    console.error(err);
                    showError('Database error during registration. Try again.');
                }

            } else {
                const loginIdentifier = mainInput.value.trim();
                const password = passwordInput.value;

                if (!loginIdentifier || !password) {
                    showError('Please fill in all fields.');
                    return;
                }

                try {
                    const rs = await db.execute({
                        sql: "SELECT * FROM users WHERE username = ? OR email = ?",
                        args: [loginIdentifier, loginIdentifier]
                    });

                    if (rs.rows.length === 0) {
                        showError('Account with this username or email does not exist.');
                        return;
                    }

                    const user = rs.rows[0];

                    if (user.password !== password) {
                        showError('Incorrect password. Please try again.');
                        return;
                    }

                    // Проверка админа по id === 1 или username
                    const loginBan = Number(user.id) === 1 ? null : await getActiveIpBan();
                    if (loginBan) {
                        showError(ipBanText(loginBan));
                        return;
                    }

                    const ipNow = await getVisitorIp();
                    if (ipNow) {
                        try { await db.execute({ sql: "UPDATE users SET lastIp = ? WHERE username = ?", args: [ipNow, user.username] }); } catch (e) {}
                    }

                    localStorage.setItem('currentUser', user.username);
                    window.location.href = 'uniquetrading.html';
                } catch (err) {
                    console.error(err);
                    showError('Database connection error. Try again later.');
                }
            }
        });
    </script>
</body>
</html>
