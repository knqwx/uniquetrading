<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Общий контейнер для форм */
        .auth-container {
            width: 380px;
            background-color: #262626;
            border-radius: 12px;
            padding: 40px 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Общие стили форм с анимацией */
        .form-box {
            display: none;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Активная форма с плавной анимацией */
        .form-box.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        /* Группа полей ввода */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group input {
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #ff7300;
        }

        /* Кнопка отправки */
        .submit-btn {
            background-color: #ff7300;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Текст внизу для переключения */
        .auth-footer {
            text-align: center;
            color: #888888;
            font-size: 13px;
            margin-top: 5px;
        }

        .auth-footer button {
            background: none;
            border: none;
            color: #ff7300;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .auth-footer button:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <!-- Форма Log in -->
        <div id="login-form" class="form-box active">
            <h2>Log in</h2>
            
            <div class="input-group">
                <label>Username or email</label>
                <input type="text" placeholder="Enter your username or email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <button class="submit-btn">Log in</button>

            <div class="auth-footer">
                Don't have an account? <button onclick="switchForm('signup-form')">Sign up</button>
            </div>
        </div>

        <!-- Форма Sign up -->
        <div id="signup-form" class="form-box">
            <h2>Sign up</h2>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" placeholder="Choose a username">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password">
            </div>

            <button class="submit-btn">Sign up</button>

            <div class="auth-footer">
                Already have an account? <button onclick="switchForm('login-form')">Log in</button>
            </div>
        </div>

    </div>

    <script>
        function switchForm(formId) {
            const forms = document.querySelectorAll('.form-box');
            
            // Сначала плавно скрываем активную форму
            forms.forEach(form => {
                form.classList.remove('active');
            });

            // Небольшая задержка, чтобы анимация исчезновения успела отработать, затем показываем новую
            setTimeout(() => {
                forms.forEach(form => {
                    form.style.display = 'none';
                });
                
                const targetForm = document.getElementById(formId);
                targetForm.style.display = 'flex';
                
                // Провоцируем перерисовку для корректного запуска анимации появления
                setTimeout(() => {
                    targetForm.classList.add('active');
                }, 10);
            }, 200);
        }

        // Устанавливаем начальное отображение для неактивных форм
        document.querySelectorAll('.form-box').forEach(form => {
            if (!form.classList.contains('active')) {
                form.style.display = 'none';
            }
        });
    </script>

</body>
</html>
