<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Общий контейнер */
        .auth-container {
            width: 380px;
            background-color: #262626;
            border-radius: 12px;
            padding: 40px 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        h2 {
            color: #ffffff;
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        /* Анимация сдвигания и раздвигания полей */
        .input-group {
            position: relative;
            margin-bottom: 16px;
            max-height: 85px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        margin-bottom 0.35s ease;
        }

        .input-group.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .input-group label {
            display: block;
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #ff7300;
        }

        /* Кнопка отправки */
        .submit-btn {
            width: 100%;
            background-color: #ff7300;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Текст внизу для переключения */
        .auth-footer {
            text-align: center;
            color: #888888;
            font-size: 13px;
            margin-top: 20px;
        }

        .auth-footer button {
            background: none;
            border: none;
            color: #ff7300;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            transition: opacity 0.2s;
        }

        .auth-footer button:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="container">
        <h2 id="form-title">Log in</h2>
        
        <form id="auth-form">
            <!-- Поле Username (скрыто на Логине, появляется на Sign Up) -->
            <div class="input-group collapsed" id="username-group">
                <label>Username</label>
                <input type="text" placeholder="Choose a username">
            </div>

            <div class="input-group">
                <label>Username or email</label>
                <input type="text" id="main-input" placeholder="Enter your username or email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Log in</button>

            <div class="auth-footer" id="auth-footer-text">
                Don't have an account? <button type="button" id="toggle-btn">Sign up</button>
            </div>
        </form>
    </div>

    <script>
        const formTitle = document.getElementById('form-title');
        const usernameGroup = document.getElementById('username-group');
        const mainInput = document.getElementById('main-input');
        const submitBtn = document.getElementById('submit-btn');
        const authFooterText = document.getElementById('auth-footer-text');

        let isLoginMode = true;

        // Используем делегирование событий или вешаем обработчик на контейнер футера, 
        // чтобы кнопка не теряла клик при изменении innerHTML
        authFooterText.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'toggle-btn') {
                isLoginMode = !isLoginMode;

                if (!isLoginMode) {
                    // Переходим в режим Sign Up
                    formTitle.textContent = 'Sign up';
                    usernameGroup.classList.remove('collapsed');
                    mainInput.placeholder = 'Enter your email';
                    mainInput.previousElementSibling.textContent = 'Email';
                    submitBtn.textContent = 'Sign up';
                    authFooterText.innerHTML = 'Already have an account? <button type="button" id="toggle-btn">Log in</button>';
                } else {
                    // Переходим в режим Log In
                    formTitle.textContent = 'Log in';
                    usernameGroup.classList.add('collapsed');
                    mainInput.placeholder = 'Enter your username or email';
                    mainInput.previousElementSibling.textContent = 'Username or email';
                    submitBtn.textContent = 'Log in';
                    authFooterText.innerHTML = "Don't have an account? <button type="button" id="toggle-btn">Sign up</button>";
                }
            }
        });
    </script>

</body>
</html>
