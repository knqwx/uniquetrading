        function isCommonPassword(pw) {
            const l = pw.toLowerCase();
            if (COMMON_PASSWORDS.has(l)) return true;
            // undo simple leetspeak (p@ssw0rd -> password) and keep letters only
            const letters = l.replace(/@/g, 'a').replace(/0/g, 'o').replace(/[1!|]/g, 'i').replace(/3/g, 'e').replace(/[$5]/g, 's').replace(/[^a-z]/g, '');
            if (COMMON_PASSWORDS.has(letters)) return true;

        function hasSequence(pw) {
            const l = pw.toLowerCase();
            if (/(.)\1{3,}/.test(l)) return true; // aaaa
            const seqs = ['abcdefghijklmnopqrstuvwxyz', '01234567890', 'qwertyuiopasdfghjklzxcvbnm', '09876543210'];
            for (const q of seqs) {
                for (let i = 0; i + 4 <= q.length; i++) {
                    const part = q.slice(i, i + 4);
                    if (l.includes(part) || l.includes(part.split('').reverse().join(''))) return true;
                }
            }
            return false;

        function passwordChecks(pw, username, email) {

            const personal = !((u.length >= 3 && l.includes(u)) || (local.length >= 3 && l.includes(local)));

                lower: /[a-z]/.test(pw),
                upper: /[A-Z]/.test(pw),
                num: /[0-9]/.test(pw),
                sym: /[^A-Za-z0-9]/.test(pw),
                common: pw.length > 0 && !isCommonPassword(pw),
                pattern: pw.length > 0 && !hasSequence(pw),
                personal: pw.length > 0 && personal
            };
        }
        function passwordScore(pw, checks) {
            if (!pw) return 0;
            let pool = 0;
            if (/[a-z]/.test(pw)) pool += 26;
            if (/[A-Z]/.test(pw)) pool += 26;
            if (/[0-9]/.test(pw)) pool += 10;
            if (/[^A-Za-z0-9]/.test(pw)) pool += 32;

            return score;

        const BURNER_KEYWORDS = ['tempmail', 'temp-mail', 'tmpmail', '10minute', 'minutemail', 'throwaway', 'trashmail', 'trash-mail', 'mailinator', 'guerrilla', 'fakeinbox', 'disposable', 'burner', 'yopmail', 'spamgourmet', 'getnada', 'tempinbox', 'sharklasers', 'dispostable', 'maildrop', 'mohmal', 'fakemail', 'emailfake', 'instantemail', 'anonmail', 'spambox'];
        function isBurnerDomain(domain) {
            domain = domain.toLowerCase();
            const parts = domain.split('.');
            for (let i = 0; i < parts.length - 1; i++) {
                if (BURNER_DOMAINS.has(parts.slice(i).join('.'))) return true;
            }
            return BURNER_KEYWORDS.some(k => domain.includes(k));
        }
        async function dnsHas(domain, type) {
            const ctl = new AbortController();
            const t = setTimeout(() => ctl.abort(), 4000);
            try {
                const r = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=${type}`, { signal: ctl.signal });
                const j = await r.json();
                return { status: j.Status, has: Array.isArray(j.Answer) && j.Answer.some(a => a.type === (type === 'MX' ? 15 : 1)) };
            } finally { clearTimeout(t); }
        }
        // returns an error message, or '' when the email is fine
        async function checkEmail(email) {
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || email.length > 254) return 'Please enter a valid email address.';
            const domain = email.split('@')[1].toLowerCase();
            if (isBurnerDomain(domain)) return 'Disposable or burner email addresses are not allowed. Please use your real email.';
            try {
                const mx = await dnsHas(domain, 'MX');
                if (mx.status === 3) return 'This email domain does not exist. Please check your email address.';
                if (!mx.has) {
                    const a = await dnsHas(domain, 'A');
                    if (!a.has) return 'This email domain cannot receive mail. Please use a real email address.';
                }
            } catch (e) { /* DNS lookup unavailable: do not block real users */ }
            return '';
        }

        // ===== 1 account per day (per IP and per device) =====
        const SIGNUP_COOLDOWN = 24 * 60 * 60 * 1000;
        function fmtWait(ms) {
            const h = Math.floor(ms / 3600000), m = Math.max(1, Math.ceil((ms % 3600000) / 60000));
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }
        // returns the remaining wait in ms (0 = allowed)
        async function signupWaitMs() {
            const now = Date.now();
            let wait = 0;
            try {
                const last = Number(localStorage.getItem('ut_last_signup')) || 0;
                if (last && now - last < SIGNUP_COOLDOWN) wait = Math.max(wait, SIGNUP_COOLDOWN - (now - last));
            } catch (e) {}
            const ip = await getVisitorIp();
            if (ip) {
                try {
                    await db.execute("CREATE TABLE IF NOT EXISTS signup_log (id INTEGER PRIMARY KEY AUTOINCREMENT, ip TEXT, createdAt INTEGER)");
                    const rs = await db.execute({ sql: "SELECT MAX(createdAt) AS t FROM signup_log WHERE ip = ?", args: [ip] });
                    const t = Number(rs.rows[0] && rs.rows[0].t) || 0;
                    if (t && now - t < SIGNUP_COOLDOWN) wait = Math.max(wait, SIGNUP_COOLDOWN - (now - t));
                } catch (e) { console.error(e); }
                try {
                    const rs2 = await db.execute({ sql: "SELECT MAX(joinedAt) AS t FROM users WHERE lastIp = ?", args: [ip] });
                    const t2 = Number(rs2.rows[0] && rs2.rows[0].t) || 0;
                    if (t2 && now - t2 < SIGNUP_COOLDOWN) wait = Math.max(wait, SIGNUP_COOLDOWN - (now - t2));
                } catch (e) { /* joinedAt/lastIp are created by the main site */ }
            }
            return wait;
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            // Проверка капчи (защита от ботов)
            const userCaptchaAnswer = parseInt(captchaInput.value.trim(), 10);
            if (isNaN(userCaptchaAnswer) || userCaptchaAnswer !== correctAnswer) {
                showError('Incorrect security answer. Please try again.');
                return;
            }

            if (!isLoginMode) {
                const username = usernameInput.value.trim();
                const email = mainInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                if (!username || !email || !password) {
                    showError('Please fill in all fields.');
                    return;
                }

                if (username.length < 3) {
                    showError('Username must be at least 3 characters long.');
                    return;
                }

                const emailErr = await checkEmail(email);
                if (emailErr) {
                    showError(emailErr);
                    return;
                }

                const pwChecks = passwordChecks(password, username, email);
                if (!passwordOk(pwChecks)) {
                    showError('Your password is too weak. Meet every requirement shown under the password box.');
                    return;
                }

                if (!document.getElementById('age-checkbox').checked) {
                    showError('You must confirm that you are at least 13 years old.');
                    return;
                }

                const waitMs = await signupWaitMs();
                if (waitMs > 0) {
                    showError(`Only one account can be created per day. Please try again in ${fmtWait(waitMs)}.`);
                    return;
                }

                const signupBan = await getActiveIpBan();
                if (signupBan) {
                    showError(ipBanText(signupBan));
                    return;
                }

                try {
                    const checkUser = await db.execute({
                        sql: "SELECT * FROM users WHERE username = ?",
                        args: [username]
                    });
                    if (checkUser.rows.length > 0) {
                        showError('This username is already taken.');
                        return;
                    }

                    const checkEmail = await db.execute({
                        sql: "SELECT * FROM users WHERE lower(email) = ?",
                        args: [email]
                    });
                    if (checkEmail.rows.length > 0) {
                        showError('This email is already registered.');
                        return;
                    }

                    const countRs = await db.execute("SELECT COUNT(*) as cnt FROM users");
                    const countVal = countRs.rows.length > 0 ? Number(countRs.rows[0].cnt || 0) : 0;
                    const newCustomId = String(countVal + 1);

                    await db.execute({
                        sql: `INSERT INTO users (customId, username, displayName, email, password, items) VALUES (?, ?, ?, ?, ?, ?)`,
                        args: [newCustomId, username, username, email, password, JSON.stringify([])]
                    });

                    const ipNew = await getVisitorIp();
                    if (ipNew) {
                        try { await db.execute({ sql: "UPDATE users SET lastIp = ? WHERE username = ?", args: [ipNew, username] }); } catch (e) { /* column is created by the main site */ }
                    }

                    try {
                        localStorage.setItem('ut_last_signup', String(Date.now()));
                        localStorage.setItem('ut_age_ok', '1');
                    } catch (e) {}
                    if (ipNew) {
                        try { await db.execute({ sql: "INSERT INTO signup_log (ip, createdAt) VALUES (?, ?)", args: [ipNew, Date.now()] }); } catch (e) { console.error(e); }
                    }

                    localStorage.setItem('currentUser', username);
                    window.location.href = 'uniquetrading.html';
                } catch (err) {
                    console.error(err);
                    showError('Database error during registration. Try again.');
                }

            } else {
                const loginIdentifier = mainInput.value.trim();
                const password = passwordInput.value;

                if (!loginIdentifier || !password) {
                    showError('Please fill in all fields.');
                    return;
                }

                try {
                    const rs = await db.execute({
                        sql: "SELECT * FROM users WHERE username = ? OR lower(email) = lower(?)",
                        args: [loginIdentifier, loginIdentifier]
                    });

                    if (rs.rows.length === 0) {
                        showError('Account with this username or email does not exist.');
                        return;
                    }

                    const user = rs.rows[0];

                    if (user.password !== password) {
                        showError('Incorrect password. Please try again.');
                        return;
                    }

                    const loginBan = String(user.customId || '') === 'knqw' ? null : await getActiveIpBan();
                    if (loginBan) {
                        showError(ipBanText(loginBan));
                        return;
                    }

                    const ipNow = await getVisitorIp();
                    if (ipNow) {
                        try { await db.execute({ sql: "UPDATE users SET lastIp = ? WHERE username = ?", args: [ipNow, user.username] }); } catch (e) { /* column is created by the main site */ }
                    }

                    localStorage.setItem('currentUser', user.username);
                    window.location.href = 'uniquetrading.html';
                } catch (err) {
                    console.error(err);
                    showError('Database connection error. Try again later.');
                }
            }
        });
