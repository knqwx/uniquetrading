<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Unique Trading</title>
    <!-- Подключаем современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Вертикальный прямоугольник по центру для регистрации */
        .signup-box {
            width: 380px;
            background-color: #262626;
            border-radius: 12px;
            padding: 40px 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .signup-box h2 {
            color: #ffffff;
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        /* Группа полей ввода */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            color: #b0b0b0;
            font-size: 13px;
            font-weight: 500;
        }

        .input-group input {
            background-color: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #ff7300;
        }

        /* Кнопка отправки */
        .submit-btn {
            background-color: #ff7300;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Текст внизу для перехода на логин */
        .auth-footer {
            text-align: center;
            color: #888888;
            font-size: 13px;
            margin-top: 5px;
        }

        .auth-footer a {
            color: #ff7300;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .auth-footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-box">
        <h2>Sign up</h2>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Choose a username">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a password">
        </div>

        <button class="submit-btn">Sign up</button>

        <div class="auth-footer">
            Already have an account? <a href="#">Log in</a>
        </div>
    </div>

</body>
</html>
